<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Home-screen icon (apple-touch-icon, PWA): the emblem on the velvet stage.
       iOS rounds the corners itself, so the background is a full square. -->
  <defs>
    <radialGradient id="stage" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#761a35"/>
      <stop offset="0.65" stop-color="#330917"/>
      <stop offset="1" stop-color="#1c040d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#stage)"/>
  <image x="36" y="30" width="440" height="440" href="__MARK__"/>
</svg>
