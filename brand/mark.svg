<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Juan o Minga</title>
  <!--
    Emblem: a slot machine. Reels: the Mingas bull, the "?" of the game, the
    Xaranga A Vorem sax. Belly plate: the red-yellow band of the peña crest.
    Lever knob: the Xaranga's angry crocodile.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.25" stop-color="#ffe28a"/>
      <stop offset="0.5" stop-color="#f0b429"/>
      <stop offset="0.56" stop-color="#a8680a"/>
      <stop offset="0.78" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#cf8f12"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.3" stop-color="#cf8f12"/>
      <stop offset="0.5" stop-color="#7a4a06"/>
      <stop offset="0.7" stop-color="#ffd866"/>
      <stop offset="1" stop-color="#a8680a"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a1c3c"/>
      <stop offset="1" stop-color="#330917"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdb3a0"/>
      <stop offset="0.28" stop-color="#fffdf6"/>
      <stop offset="0.72" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#bdb3a0"/>
    </linearGradient>
    <radialGradient id="croc" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#c8ff7a"/>
      <stop offset="0.5" stop-color="#5cc82e"/>
      <stop offset="1" stop-color="#1f6b12"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#f0b429"/>
    </radialGradient>
    <clipPath id="window">
      <rect x="128" y="226" width="256" height="112" rx="12"/>
    </clipPath>
  </defs>

  <!-- Lever: rod from the side of the cabinet up to the croc knob -->
  <path d="M398 318 H440 V166" fill="none" stroke="#7a4a06" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 318 H440 V166" fill="none" stroke="url(#goldSide)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="392" y="298" width="20" height="40" rx="6" fill="url(#gold)" stroke="#7a4a06" stroke-width="3"/>

  <!-- Croc knob -->
  <g transform="translate(440 142)">
    <circle r="34" fill="url(#croc)" stroke="#123f0a" stroke-width="4"/>
    <!-- angry brow + eye -->
    <path d="M-20 -14 L2 -6" stroke="#123f0a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-6" cy="0" r="7" fill="#fff" stroke="#123f0a" stroke-width="2.5"/>
    <circle cx="-4" cy="1" r="3" fill="#123f0a"/>
    <!-- toothy grin -->
    <path d="M-22 14 Q0 26 24 10 L22 18 Q0 34 -20 22 Z" fill="#fff" stroke="#123f0a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-16 17 L-12 23 L-8 19 L-4 25 L0 20 L4 25 L8 19 L12 23 L17 16" fill="none" stroke="#123f0a" stroke-width="2" stroke-linejoin="round"/>
    <!-- highlight -->
    <ellipse cx="-12" cy="-20" rx="10" ry="5" fill="#fff" opacity="0.45" transform="rotate(-25 -12 -20)"/>
  </g>

  <!-- Base tray -->
  <path d="M72 440 H440 L424 486 H88 Z" fill="url(#gold)" stroke="#7a4a06" stroke-width="4" stroke-linejoin="round"/>

  <!-- Cabinet with arched top -->
  <path d="M96 446 V196 Q96 116 256 110 Q416 116 416 196 V446 Z" fill="url(#goldSide)" stroke="#7a4a06" stroke-width="5" stroke-linejoin="round"/>
  <path d="M112 440 V200 Q112 132 256 127 Q400 132 400 200 V440 Z" fill="url(#velvet)"/>

  <!-- Marquee header: bulbs along the arch -->
  <path d="M132 200 Q132 148 256 144 Q380 148 380 200 Z" fill="#1c040d" stroke="url(#gold)" stroke-width="5"/>
  <g fill="url(#bulb)" stroke="#7a4a06" stroke-width="1.5">
    <circle cx="140" cy="194" r="6"/>
    <circle cx="150" cy="174" r="6"/>
    <circle cx="168" cy="160" r="6"/>
    <circle cx="190" cy="151" r="6"/>
    <circle cx="214" cy="146" r="6"/>
    <circle cx="238" cy="144" r="6"/>
    <circle cx="274" cy="144" r="6"/>
    <circle cx="298" cy="146" r="6"/>
    <circle cx="322" cy="151" r="6"/>
    <circle cx="344" cy="160" r="6"/>
    <circle cx="362" cy="174" r="6"/>
    <circle cx="372" cy="194" r="6"/>
  </g>
  <!-- Jackpot star -->
  <path d="M256 158 L263 175 L281 176 L267 187 L272 205 L256 195 L240 205 L245 187 L231 176 L249 175 Z"
        fill="url(#gold)" stroke="#7a4a06" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Reel window -->
  <rect x="118" y="216" width="276" height="132" rx="18" fill="url(#gold)" stroke="#7a4a06" stroke-width="4"/>
  <rect x="128" y="226" width="256" height="112" rx="12" fill="#1c040d"/>
  <g clip-path="url(#window)">
    <rect x="132" y="226" width="80" height="112" fill="url(#reel)"/>
    <rect x="216" y="226" width="80" height="112" fill="url(#reel)"/>
    <rect x="300" y="226" width="80" height="112" fill="url(#reel)"/>

    <!-- Reel 1: the Mingas bull, charging -->
    <g transform="translate(172 284) scale(0.72) translate(-50 -34)" fill="#1a0a0a">
      <path d="M4 44 L2 38 L8 30 C12 22 20 16 30 10 C40 6 50 12 62 16 C74 18 86 16 92 22 C96 28 95 36 92 42 L95 62 L88 62 L84 48 L80 48 L80 62 L73 62 L72 46 C62 48 50 48 42 46 L40 62 L33 62 L32 48 L28 48 L27 62 L20 62 L21 46 C16 46 12 48 8 48 Z"/>
      <path d="M11 30 C3 27 0 18 6 10" fill="none" stroke="#1a0a0a" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M17 26 C15 18 19 11 26 9" fill="none" stroke="#1a0a0a" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M92 22 C100 16 101 8 97 2" fill="none" stroke="#1a0a0a" stroke-width="3" stroke-linecap="round"/>
      <path d="M97 2 L93 -2 L101 -1 Z"/>
    </g>

    <!-- Reel 2: the question -->
    <g transform="translate(256 282)">
      <path d="M-16 -16 C-16 -34 16 -36 17 -16 C18 -4 1 -2 1 12" fill="none" stroke="#7a0616" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-16 -16 C-16 -34 16 -36 17 -16 C18 -4 1 -2 1 12" fill="none" stroke="#ee1b3a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1" cy="31" r="8" fill="#ee1b3a" stroke="#7a0616" stroke-width="2.5"/>
    </g>

    <!-- Reel 3: the Xaranga sax -->
    <g transform="translate(340 282) rotate(-12)">
      <path d="M-4 -40 L4 -32 L4 16 Q4 34 -10 32 Q-20 30 -18 16" fill="none" stroke="#7a4a06" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-4 -40 L4 -32 L4 16 Q4 34 -10 32 Q-20 30 -18 16" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-30 -2 L-6 -2 L-13 18 L-22 18 Z" fill="url(#gold)" stroke="#7a4a06" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-4 -40 L-11 -46" stroke="#1a0a0a" stroke-width="5" stroke-linecap="round"/>
      <g fill="#fff1b8" stroke="#7a4a06" stroke-width="1.5">
        <circle cx="4" cy="-20" r="3.5"/>
        <circle cx="4" cy="-8" r="3.5"/>
        <circle cx="4" cy="4" r="3.5"/>
      </g>
    </g>

    <!-- cylinder shading + payline -->
    <rect x="128" y="226" width="256" height="30" fill="#140500" opacity="0.35"/>
    <rect x="128" y="308" width="256" height="30" fill="#140500" opacity="0.35"/>
  </g>
  <path d="M124 282 H388" stroke="#ee1b3a" stroke-width="2.5" opacity="0.7"/>

  <!-- Belly plate: red-yellow band from the peña crest, with a coin slot -->
  <rect x="136" y="368" width="240" height="56" rx="8" fill="#c60b1e" stroke="url(#gold)" stroke-width="4"/>
  <rect x="140" y="382" width="232" height="28" fill="#ffc400"/>
  <rect x="236" y="388" width="40" height="16" rx="5" fill="#1c040d" stroke="#7a4a06" stroke-width="2"/>
  <rect x="244" y="394" width="24" height="4" rx="2" fill="#000"/>
</svg>
