name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels the queued one, never the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # Pages knows the public URL: github.io subpath now, juanominga.com once the
      # custom domain is set. base_path is "/Juan-o-Minga" or "" respectively.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # Repo variables (Settings -> Secrets and variables -> Actions -> Variables).
          # The anon key is public by design, so it doesn't need to be a secret.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # From the Pages settings; the BASE_PATH repo variable overrides it.
          BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          # Absolute root for link previews (og:image, og:url).
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      # Any unknown path (e.g. juanominga.com/jugar) still loads the app, and the
      # hash router falls back to the intro screen.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
